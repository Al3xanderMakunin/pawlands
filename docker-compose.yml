services:
  postgres:
    image: postgres:17-alpine
    container_name: pawlands-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawlands
      POSTGRES_PASSWORD: pawlands
      POSTGRES_DB: pawlands
    ports:
      - "5432:5432"
    volumes:
      - pawlands_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawlands -d pawlands"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pawlands-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pawlands_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pawlands_pg_data:
  pawlands_redis_data:
